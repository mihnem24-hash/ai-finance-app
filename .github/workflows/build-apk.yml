name: Сборка Android APK (Flet + Flutter)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Сборка APK (Flet + Flutter)
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet

      - name: Сгенерировать иконку приложения
        run: |
          python tools/make_icon.py || echo "Icon script skipped or failed"

      - name: Собрать APK
        run: |
          flet build apk

      - name: Загрузить APK в артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/apk/*.apk