[project]
name = "ai-finance-app"
version = "1.0.0"
description = "Мобильное приложение: курсы валют, индексы и AI Leaderboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["flet>=0.28.0"]

# Настройки сборки приложения (команда: flet build apk)
[tool.flet]
product = "AI и Финансы"
org = "com.myaiproject"
company = "MyAIProject"
copyright = "© 2026 MyAIProject"
# Иконка приложения. Перед сборкой сгенерируйте её:
# python -I tools/make_icon.py assets/icon.png
icon = "assets/icon.png"

[tool.flet.splash_screen]
bgcolor = "#3D5AFE"

[tool.flet.android]
# Минимальная версия Android 7.0 – покрывает ~97% устройств
min_sdk_version = 24